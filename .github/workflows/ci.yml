name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck + Workers runtime tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  migration:
    name: Migration — end-to-end rehearsal (fixtures → D1 → API)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: migration
      - run: npm test
        working-directory: migration

  frontends:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [doer, admin] }
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: "false"   # existing lint warnings must not fail the build
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BASE_URL: https://api.example.invalid
      - name: Ensure no secrets are bundled
        run: |
          if grep -rEl "EAA[A-Za-z0-9]{20,}|graph\.facebook\.com|PRIVATE KEY" build/; then
            echo "::error::Secret-looking content found in the frontend bundle"; exit 1; fi
